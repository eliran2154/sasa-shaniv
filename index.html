<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - סאסא שניב</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial;background:#0f0f1a;color:#f0ead6;margin:0;padding:0 0 100px}header{position:sticky;top:0;background:#16213e;padding:18px;text-align:center;border-bottom:2px solid #c9a84c}h1{margin:0;font-size:24px}.wrap{padding:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#16213e;border:1px solid #2a3f60;border-radius:10px;padding:9px 12px;margin-bottom:7px}.row span{flex:1}.q{display:flex;border:1px solid #2a3f60;border-radius:8px;overflow:hidden}button,input{width:36px;height:34px;border:0;background:#0f0f1a;color:#f0ead6;text-align:center;font-size:16px}button{color:#c9a84c;font-size:20px}textarea{width:100%;box-sizing:border-box;min-height:70px;background:#16213e;color:#fff;border:1px solid #2a3f60;border-radius:10px;padding:10px}.warn{text-align:center;color:#e8c97a;font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;border-top:2px solid #c9a84c;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{width:auto;padding:0 18px;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><div>✦ הזמנה ✦</div><h1>סאסא שניב</h1></header><div class="wrap" id="products"></div><div class="wrap"><textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897';const PRODUCTS=['משטח 424','משטח 444','משטח 445','משטח מהדורה 48','משטח 100 אס','משטח סמיכה','פרו 100','פרו 122 השרייה','פרו 801F חיטויי','פרו 903 חיטוי','מתז חומץ','מסיר R2500 אבן','שלישיה לידיים כחול','שלישיה לידיים סגול','שלישיה לידיים ירוק','ג׳ל כביסה ירוק','ג׳ל כביסה כחול','מרכך כביסה ורוד','מרכך כביסה כחול','מרכך כביסה לבן','מרכך כביסה צהוב','מגבונים לרצפה','כלור 1200 מרוכז','מבריק למדיח 700cc','תרסיס חיטוי 500 מ״ל','די תיקן','פרו פרש מרענן','מטהר אויר אורנים','מטהר אויר לימון','מטהר אויר פריחה','מטהר אויר לבנדר','מבשם פלירוסול','מתז כללי סודה'];const wrap=document.getElementById('products');PRODUCTS.forEach(p=>{const r=document.createElement('div');r.className='row';const n=document.createElement('span');n.textContent=p;const q=document.createElement('div');q.className='q';const m=document.createElement('button');m.textContent='−';m.onclick=()=>chg(m,-1);const i=document.createElement('input');i.type='number';i.min='0';i.value='0';i.inputMode='numeric';i.addEventListener('input',refresh);const b=document.createElement('button');b.textContent='+';b.onclick=()=>chg(b,1);q.append(m,i,b);r.append(n,q);wrap.appendChild(r)});function chg(btn,d){let i=btn.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);document.getElementById('count').textContent=t}function sendOrder(){let lines=['🛒 *הזמנה - סאסא שניב*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;document.querySelectorAll('.row').forEach(r=>{let q=parseInt(r.querySelector('input').value)||0;if(q>0){lines.push('• '+r.querySelector('span').textContent+': *'+q+'*');total+=q}});if(!total){alert('לא נבחרו פריטים');return}let n=document.getElementById('notes').value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'))}</script></body></html>
